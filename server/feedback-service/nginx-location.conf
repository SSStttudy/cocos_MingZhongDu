# Add these locations inside the existing nyasd.net HTTPS server block.
location = /api/mingzhongdu/feedback {
    proxy_pass http://127.0.0.1:3102/feedback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location ^~ /api/mingzhongdu/feedback/ {
    proxy_pass http://127.0.0.1:3102/feedback/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location = /api/mingzhongdu/health {
    proxy_pass http://127.0.0.1:3102/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
